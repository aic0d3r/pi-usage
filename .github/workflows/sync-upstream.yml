name: Sync upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into sync branch and open PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git remote add upstream https://github.com/mtrojnar/pi-usage.git
          git fetch upstream main
          git push -f origin upstream/main:refs/heads/upstream-main
          if git merge-base --is-ancestor upstream/main origin/main; then echo "up to date"; exit 0; fi
          git checkout -B sync/upstream origin/main
          if ! git merge --no-edit upstream/main; then
            echo "Merge conflict: resolve manually"; git merge --abort; exit 1
          fi
          git push -f origin sync/upstream
          gh pr list --head sync/upstream --state open --json number --jq length | grep -q '^0$' \
            && gh pr create --base main --head sync/upstream \
              --title "Sync upstream mtrojnar/pi-usage" --body "Automated upstream merge. Run CI and check pi version compatibility before merging." || true
